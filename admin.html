<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Panel – Koncertownik</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/duotone/style.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="container container-admin">

    <header class="hero">
      <h1><i class="ph ph-lock-key" aria-hidden="true"></i> Panel</h1>
      <a class="link-strona" href="index.html" target="_blank">Otwórz stronę <i class="ph ph-arrow-square-out" aria-hidden="true"></i></a>
    </header>

    <!-- Logowanie -->
    <section id="ekranLogowania" hidden>
      <h2>Zaloguj się</h2>
      <form id="formLogowania" class="formularz">
        <label>E-mail <input type="email" name="email" autocomplete="username" required></label>
        <label>Hasło <input type="password" name="haslo" autocomplete="current-password" required></label>
        <button type="submit" class="btn">Zaloguj</button>
      </form>
    </section>

    <!-- Panel po zalogowaniu -->
    <div id="panel" hidden>
      <nav class="zakladki">
        <button type="button" data-zakladka="koncerty"><i class="ph ph-ticket"></i> Koncerty</button>
        <button type="button" data-zakladka="artysci"><i class="ph ph-microphone-stage"></i> Artyści</button>
        <button type="button" data-zakladka="miasta"><i class="ph ph-map-pin"></i> Miasta</button>
        <button type="button" data-zakladka="wyglad"><i class="ph ph-palette"></i> Wygląd</button>
        <button type="button" data-zakladka="ksiega"><i class="ph ph-pen-nib"></i> Księga</button>
        <button type="button" id="wyloguj" class="wyloguj"><i class="ph ph-sign-out"></i> Wyloguj</button>
      </nav>
      <div id="tresc"></div>
    </div>

    <div id="komunikat" class="komunikat" aria-live="polite"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="supabase.js"></script>
  <script src="dane.js"></script>
  <script src="narzedzia.js"></script>
  <script src="motyw.js"></script>
  <script src="ikony.js"></script>

  <!-- Moduły panelu (admin.js na końcu – uruchamia resztę) -->
  <script src="admin-wspolne.js"></script>
  <script src="admin-edytor-motywu.js"></script>
  <script src="admin-koncerty.js"></script>
  <script src="admin-artysci.js"></script>
  <script src="admin-miasta.js"></script>
  <script src="admin-wyglad.js"></script>
  <script src="admin-ksiega.js"></script>
  <script src="admin.js"></script>
</body>
</html>
