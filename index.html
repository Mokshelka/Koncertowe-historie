<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koncertownik 🎵</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <header class="hero">
      <h1>🎵 KONCERTOWNIK</h1>
      <p class="description">
        Witaj w moim cyfrowym pamiętniku muzycznym! To miejsce na moje koncertowe wspomnienia, setlisty i zdjęcia.
      </p>
    </header>

    <!-- Obracający się globus 3D z lądami i siatką -->
    <section class="map-section">
      <div class="globe-container">
        <div class="globe"></div>
      </div>
      <div class="cities-list">
        <span class="city-badge">📍 Wrocław</span>
        <span class="city-badge">📍 Kraków</span>
        <span class="city-badge">📍 Warszawa</span>
        <span class="city-badge">📍 Lublin</span>
        <span class="city-badge">📍 Kopenhaga</span>
      </div>
    </section>

    <!-- Rozwijane menu z artystami -->
    <section class="menu-section">
      <div class="menu-accordion" id="artistList"></div>
    </section>

    <!-- Formularz gości -->
    <section class="guestbook-section">
      <h2>✍️ Zostawcie wpis</h2>
      <form id="guestbookForm">
        <input type="text" placeholder="Imię / Nick z IG" required>
        <textarea placeholder="Komentarz" rows="2" required></textarea>
        <button type="submit">Wyślij</button>
      </form>
    </section>

    <footer>
      <p>Stworzone z pasji do muzyki ✨ | Koncertownik</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
