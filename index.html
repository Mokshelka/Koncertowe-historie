<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koncertownik</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/duotone/style.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="globe.css">
  <link rel="stylesheet" href="lista.css">
  <link rel="stylesheet" href="ksiega.css">
</head>
<body>
  <div class="container">

    <!-- Nagłówek (treść z dane.js) -->
    <header class="hero">
      <h1><i class="ph ph-vinyl-record" aria-hidden="true"></i> <span id="tytulStrony"></span></h1>
      <p class="description" id="opisStrony"></p>
    </header>

    <!-- Globus z pinezkami + plakietki miast -->
    <section class="map-section">
      <div class="globe-container">
        <canvas id="globe" aria-label="Obracający się globus z zaznaczonymi miastami koncertów"></canvas>
        <div id="globeTooltip" class="globe-tooltip"></div>
      </div>
      <div class="cities-list" id="listaMiast"></div>
    </section>

    <!-- Lista artystów -->
    <section>
      <h2 class="naglowek-artystow">
        <span><i class="ph ph-microphone-stage" aria-hidden="true"></i> Artyści</span>
        <span class="liczba" id="liczbaArtystow"></span>
      </h2>
      <div class="siatka-artystow" id="artistList"></div>
    </section>

    <!-- Księga gości -->
    <section class="guestbook-section">
      <h2><i class="ph ph-pen-nib" aria-hidden="true"></i> Zostawcie wpis</h2>
      <form id="guestbookForm">
        <input type="text" name="imie" placeholder="Imię / Nick z IG" maxlength="60" required>
        <textarea name="tresc" placeholder="Komentarz" rows="2" maxlength="500" required></textarea>
        <input type="text" name="www" class="pulapka" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit">Wyślij</button>
        <p id="guestbookInfo" class="guestbook-info" aria-live="polite"></p>
      </form>
      <div id="wpisyKsiegi" class="wpisy"></div>
    </section>

    <footer><p id="stopka"></p></footer>
  </div>

  <!-- Biblioteki do globusa -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>

  <!-- Baza danych -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

  <!-- Nasz kod (glowna.js na końcu – ona uruchamia resztę) -->
  <script src="supabase.js"></script>
  <script src="dane.js"></script>
  <script src="narzedzia.js"></script>
  <script src="motyw.js"></script>
  <script src="ikony.js"></script>
  <script src="globe.js"></script>
  <script src="miasta.js"></script>
  <script src="lista.js"></script>
  <script src="ksiega.js"></script>
  <script src="glowna.js"></script>
</body>
</html>
