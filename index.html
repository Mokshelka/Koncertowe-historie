<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koncertownik 🎵</title>
  
  <!-- Style CSS -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Mapa Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

  <div class="container">
    
    <!-- Nagłówek -->
    <header class="hero">
      <h1>🎵 KONCERTOWNIK</h1>
      <p class="description">
        Witaj w moim cyfrowym pamiętniku muzycznym! To miejsce na moje koncertowe wspomnienia, setlisty i zdjęcia.
      </p>
    </header>

    <!-- Mapa w fioletowym klimacie -->
    <section class="map-section">
      <div id="map"></div>
    </section>

    <!-- Rozwijane menu z artystami -->
    <section class="menu-section">
      <div class="menu-accordion" id="artistList">
        <!-- Generowane dynamicznie przez script.js -->
      </div>
    </section>

    <!-- Formularz gości -->
    <section class="guestbook-section">
      <h2>✍️ Zostawcie wpis</h2>
      <form id="guestbookForm">
        <input type="text" placeholder="Imię / Nick z IG" required>
        <textarea placeholder="Komentarz" rows="2" required></textarea>
        <button type="submit">Wyślij</button>
      </form>
    </section>

    <footer>
      <p>Stworzone z pasji do muzyki ✨ | Koncertownik</p>
    </footer>

  </div>

  <!-- Skrypty -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
