<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koncertownik 🎵</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <header class="hero">
      <h1>🎵 KONCERTOWNIK</h1>
      <p class="description">
        Witaj w moim cyfrowym pamiętniku muzycznym! To miejsce na moje koncertowe wspomnienia, setlisty i zdjęcia.
      </p>
    </header>

    <!-- Obracający się globus z granicami krajów i pinezkami -->
    <section class="map-section">
      <div class="globe-container">
        <canvas id="globe" aria-label="Obracający się globus z zaznaczonymi miastami koncertów"></canvas>
        <div id="globeTooltip" class="globe-tooltip"></div>
      </div>
      <div class="cities-list">
        <button type="button" class="city-badge" data-city="Wrocław">📍 Wrocław</button>
        <button type="button" class="city-badge" data-city="Kraków">📍 Kraków</button>
        <button type="button" class="city-badge" data-city="Warszawa">📍 Warszawa</button>
        <button type="button" class="city-badge" data-city="Lublin">📍 Lublin</button>
        <button type="button" class="city-badge" data-city="Kopenhaga">📍 Kopenhaga</button>
      </div>
    </section>

    <!-- Rozwijane menu z artystami -->
    <section class="menu-section">
      <div class="menu-accordion" id="artistList"></div>
    </section>

    <!-- Formularz gości -->
    <section class="guestbook-section">
      <h2>✍️ Zostawcie wpis</h2>
      <form id="guestbookForm">
        <input type="text" placeholder="Imię / Nick z IG" required>
        <textarea placeholder="Komentarz" rows="2" required></textarea>
        <button type="submit">Wyślij</button>
      </form>
    </section>

    <footer>
      <p>Stworzone z pasji do muzyki ✨ | Koncertownik</p>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="globe.js"></script>
  <script src="script.js"></script>
</body>
</html>
